# dsh-purge 2.x — Web-only Cordis runtime (no host disk patches)

- id: redteam-store
  name: dsh-redteam-store
  disabled: true

- id: redteam-ui
  name: dsh-redteam-ui
  disabled: true

- id: redteam-mode
  name: dsh-redteam-mode
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    personaSuffix: "Your working directory is {{cwd}}."

- id: dsh-purge
  inject: [systemPrompt, tools]

- insert:
    - id: dsh-purge
      name: "dsh-purge"
      inject: [systemPrompt, tools]
      config:
        enabled: true
        stripMnemon: true
        verbose: false
        postPrompt: ""
        postPromptOrder: 5100
        capabilityProtocol: true

    - id: dsh-purge-redteam
      name: dsh-purge/redteam
